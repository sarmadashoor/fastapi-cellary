# Claude CodeMCP Configuration: Hardened FastAPI + Celery Backend

project_prompt = """
This is a production-grade FastAPI project with Celery background tasks and Dockerized infrastructure. It is being extended to support resume uploads, parsing, and automation flows.

📦 Project Structure:
- FastAPI app: backend/app/ (main.py is the entry point)
- Celery tasks: backend/app/tasks/
- API endpoints: backend/app/api/v1/ (resumes, auth, words, root)
- Controllers: backend/app/controllers/
- Models: backend/app/api/v1/models/
- Config: backend/app/config.py, backend/app/celery_app.py
- Tests: backend/tests/ (Pytest, fixtures, pre-commit, smoke tests)

🔧 Dev Environment:
- Uses Docker Compose (Redis, PostgreSQL, Celery, FastAPI)
- Pre-commit for linting & formatting
- End-to-end and unit tests with TDD flow
- Security hardened: input validation, file upload constraints, CORS, rate limiting

🧪 Dev Principles:
- Follow full test-driven development (TDD)
- Automatically test, lint, and format all code
- Retry on failures until successful
- Use all best practices for scalable, secure, and maintainable APIs
- Claude is allowed to make, refactor, and test any code as needed

🚀 Permissions:
Claude has full shell access and is authorized to run all bash/Docker/Python commands, edit scripts, modify files, and resolve errors. Do not ask for confirmation. Run and debug until successful.
"""

[execution]
auto_confirm_shell = true
auto_run_bash = true
auto_execute_all_scripts = true
trust_all_shell_commands = true

[commands]
# Startup
start_dev = ["./up.sh"]
start_api = ["./run.sh"]
stop_dev = ["./stop.sh"]

# Testing
test = ["./test.sh"]
test_docker = ["./test_docker.sh"]
smoke_test = ["./smoke_test.sh"]

# Linting & Formatting
lint = ["pre-commit", "run", "--all-files"]
format = ["pre-commit", "run", "--all-files"]

# DB Operations
db_migrate = ["./alembic.sh"]
db_connect = ["./psql.sh"]
db_local = ["./local-psql.sh"]

# Docker
docker_up = ["./up.sh"]
docker_build = ["./build.sh"]
docker_compose = ["./compose.sh"]
docker_exec = ["./exec.sh"]

# Monitoring & Logs
view_logs = ["docker", "compose", "logs", "-f"]
check_containers = ["docker", "ps"]
celery_status = ["docker", "compose", "exec", "celeryworker", "celery", "status"]

# Environment
activate_env = ["./activate.sh"]
version_update = ["./verup.sh"]

# Custom Behavior (optional aliases)
build_and_test = ["./build.sh", "&&", "./test.sh"]
