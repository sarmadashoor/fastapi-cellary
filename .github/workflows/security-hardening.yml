# Security-hardened CI/CD pipeline
# Comprehensive security testing and deployment

name: Security Hardening CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security vulnerability scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install security tools
        run: |
          pip install bandit safety semgrep
      
      - name: Run Bandit security analysis
        run: |
          bandit -r backend/ -f json -o bandit-report.json
          bandit -r backend/ -f txt
        continue-on-error: true
      
      - name: Run Safety vulnerability check
        run: |
          pip install -r docker/backend/requirements.txt
          safety check --json --output safety-report.json
          safety check
        continue-on-error: true
      
      - name: Run Semgrep security scan
        run: |
          semgrep --config=auto --json --output=semgrep-report.json backend/
          semgrep --config=auto backend/
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

  # Container security scanning
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build hardened backend image
        run: |
          docker build -f docker/backend/Dockerfile.hardened \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${{ github.ref_name }} \
            -t backend-hardened:test .
      
      - name: Build hardened worker image
        run: |
          docker build -f docker/celeryworker/Dockerfile.hardened \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${{ github.ref_name }} \
            -t worker-hardened:test .
      
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
      
      - name: Scan backend image with Trivy
        run: |
          trivy image --format json --output backend-trivy-report.json backend-hardened:test
          trivy image backend-hardened:test
        continue-on-error: true
      
      - name: Scan worker image with Trivy
        run: |
          trivy image --format json --output worker-trivy-report.json worker-hardened:test
          trivy image worker-hardened:test
        continue-on-error: true
      
      - name: Upload container security reports
        uses: actions/upload-artifact@v3
        with:
          name: container-security-reports
          path: |
            backend-trivy-report.json
            worker-trivy-report.json

  # Infrastructure security testing
  infrastructure-security:
    name: Infrastructure Security Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      
      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VCS_REF=${{ github.sha }}
          VERSION=${{ github.ref_name }}
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password_very_strong_for_security_testing_purposes
          REDIS_PASSWORD=test_redis_password_very_strong_for_security_testing_purposes
          JWT_SECRET=test_jwt_secret_very_strong_for_security_testing_purposes_must_be_32_chars
          ADMIN_PASSWORD=test_admin_password_strong
          EOF
      
      - name: Start hardened services
        run: |
          docker-compose -f docker-compose-hardened.yml --env-file .env.test up -d
          sleep 30  # Wait for services to start
      
      - name: Test service security
        run: |
          # Test that services are running with proper security
          docker-compose -f docker-compose-hardened.yml ps
          
          # Test health checks
          curl -f http://localhost:8001/api/observability/health || exit 1
          
          # Test that dangerous endpoints are blocked
          ! curl -f "http://localhost:8001/api/test?id=1' OR '1'='1" || exit 1
          
          # Test rate limiting
          for i in {1..10}; do
            curl -X POST http://localhost:8001/api/auth \
              -H "Content-Type: application/json" \
              -d '{"login":"test","password":"test"}' \
              -w "Status: %{http_code}\n" || true
          done
      
      - name: Check container security settings
        run: |
          # Verify containers are running as non-root
          docker-compose -f docker-compose-hardened.yml exec -T backend whoami | grep -v root
          docker-compose -f docker-compose-hardened.yml exec -T celeryworker whoami | grep -v root
          
          # Verify read-only filesystems where configured
          docker inspect nginx-hardened | jq '.[0].HostConfig.ReadonlyRootfs'
          docker inspect redis-hardened | jq '.[0].HostConfig.ReadonlyRootfs'
      
      - name: Stop services
        run: |
          docker-compose -f docker-compose-hardened.yml down -v

  # Security testing
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r docker/backend/requirements.txt
          pip install pytest pytest-cov
      
      - name: Run security tests
        run: |
          python -m pytest backend/tests/security/ -v --tb=short
        env:
          PYTHONPATH: backend
      
      - name: Generate security test report
        run: |
          python -m pytest backend/tests/security/ --cov=backend/app --cov-report=xml --cov-report=html
        continue-on-error: true
      
      - name: Upload security test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: security-tests

  # Build and push hardened images
  build-push:
    name: Build and Push Hardened Images
    runs-on: ubuntu-latest
    needs: [security-scan, container-security, infrastructure-security, security-testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile.hardened
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/celeryworker/Dockerfile.hardened
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  # Security reporting
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, container-security, infrastructure-security, security-testing]
    if: always()
    
    steps:
      - name: Download security reports
        uses: actions/download-artifact@v3
        with:
          name: security-reports
      
      - name: Download container security reports
        uses: actions/download-artifact@v3
        with:
          name: container-security-reports
      
      - name: Generate consolidated security report
        run: |
          echo "# Security Hardening Report" > security-report.md
          echo "Generated on: $(date)" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Vulnerability Scan Results" >> security-report.md
          echo "- Bandit: $(test -f bandit-report.json && echo 'Completed' || echo 'Failed')" >> security-report.md
          echo "- Safety: $(test -f safety-report.json && echo 'Completed' || echo 'Failed')" >> security-report.md
          echo "- Semgrep: $(test -f semgrep-report.json && echo 'Completed' || echo 'Failed')" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Container Security Results" >> security-report.md
          echo "- Backend Trivy: $(test -f backend-trivy-report.json && echo 'Completed' || echo 'Failed')" >> security-report.md
          echo "- Worker Trivy: $(test -f worker-trivy-report.json && echo 'Completed' || echo 'Failed')" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Infrastructure Security" >> security-report.md
          echo "- Service startup: ${{ needs.infrastructure-security.result }}" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Security Testing" >> security-report.md
          echo "- Security test suite: ${{ needs.security-testing.result }}" >> security-report.md
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md