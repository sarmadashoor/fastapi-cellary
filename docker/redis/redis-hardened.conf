# Redis hardened configuration for production security
#
# Based on Redis security best practices and CIS benchmarks

################################## SECURITY ###################################

# Require authentication
requirepass ${REDIS_PASSWORD}

# Disable dangerous commands for security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command EVAL ""
rename-command SCRIPT ""
rename-command SHUTDOWN SHUTDOWN_SECURE

# ACL Configuration (Redis 6+)
# Create dedicated users for different services
# Default user (for legacy clients)
user default off nopass -@all

# Application user with limited permissions
user app-user on >${REDIS_APP_PASSWORD} -@all +@read +@write +@list +@set +@stream +@hash +@sorted_set +@connection +ping +info +client

# Celery worker user with specific permissions
user celery-worker on >${REDIS_CELERY_PASSWORD} -@all +@read +@write +@list +@set +@hash +@connection +ping +info +client +brpop +blpop +rpush +lpush +llen +del

# Admin user for management (restricted)
user admin on >${REDIS_ADMIN_PASSWORD} -@all +@read +@connection +@keyspace +info +client +memory +ping

################################## NETWORK #####################################

# Bind to specific interface (not all interfaces)
bind 0.0.0.0

# Protected mode
protected-mode yes

# Port configuration
port 6379

# TCP listen() backlog
tcp-backlog 511

# Connection timeout
timeout 300

# TCP keepalive
tcp-keepalive 300

# Max clients
maxclients 1000

################################## MEMORY ######################################

# Memory usage limit
maxmemory 256mb

# Memory eviction policy
maxmemory-policy allkeys-lru

# Memory samples for LRU
maxmemory-samples 5

################################## PERSISTENCE #################################

# Disable RDB snapshots for security (data in memory only)
save ""

# Disable AOF for security (reduce disk I/O attack surface)
appendonly no

################################## LOGGING ####################################

# Log level
loglevel notice

# Log file (empty string = stdout)
logfile ""

# Syslog facility
syslog-enabled yes
syslog-ident redis-hardened

################################## SLOW LOG ###################################

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

################################## LATENCY MONITOR ############################

# Latency monitoring
latency-monitor-threshold 100

################################## CLIENTS #####################################

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Client timeout
timeout 300

################################## SECURITY MODULES ###########################

# Load security modules if available
# loadmodule /usr/lib/redis/modules/redismodule-security.so

################################## REPLICATION ################################

# Replication security
# repl-diskless-sync yes
# repl-diskless-sync-delay 5

################################## CLUSTER ####################################

# Cluster security
# cluster-enabled no
# cluster-require-full-coverage yes

################################## OTHER ######################################

# Disable Lua debugging
lua-replicate-commands yes

# Hash max ziplist entries
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set max intset entries
set-max-intset-entries 512

# Sorted set max ziplist entries
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Stream configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hz frequency
hz 10

# Dynamic Hz
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB checksum
rdbchecksum yes

# Stop writes on RDB errors
stop-writes-on-bgsave-error no

# Compression
rdbcompression yes

# LZF compression
# lzf-compression yes

################################## TLS/SSL ####################################

# TLS Configuration (uncomment to enable)
# port 0
# tls-port 6380
# tls-cert-file /etc/redis/tls/redis.crt
# tls-key-file /etc/redis/tls/redis.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-ciphers HIGH:!aNULL:!MD5
# tls-protocols TLSv1.2 TLSv1.3
# tls-prefer-server-ciphers yes
# tls-session-caching no
# tls-session-cache-size 5000
# tls-session-cache-timeout 60

################################## NOTIFICATIONS ##############################

# Keyspace notifications (disabled for security)
notify-keyspace-events ""

################################## ADVANCED ###################################

# Hash table growth
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Defragmentation
# activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100

# Jemalloc background thread
jemalloc-bg-thread yes

# Security hardening completed
# Configuration follows Redis security best practices
# Suitable for production deployment with proper authentication