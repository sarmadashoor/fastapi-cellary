# Security-hardened Redis configuration
# Based on Redis 7.x security best practices

# Network and Security
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Security: Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_SECURE_COMMAND
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Security: Enable protected mode
protected-mode yes

# Authentication (password will be set via environment variable)
# requirepass will be set in start script

# Security: ACL configuration
aclfile /usr/local/etc/redis/users.acl

# Logging
loglevel notice
logfile /var/log/redis/redis.log
syslog-enabled yes
syslog-ident redis

# Security: Disable potentially dangerous features
stop-writes-on-bgsave-error yes

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence configuration (minimal for security)
save 900 1
save 300 10
save 60 10000

# Security: RDB file permissions
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Security: AOF disabled for minimal attack surface
appendonly no

# Security: Disable Lua debugging
lua-time-limit 5000

# Security: Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security: Client management
maxclients 128
tcp-backlog 128

# Security: HyperLogLog settings
hll-sparse-max-bytes 3000

# Security: Hash settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Security: List settings  
list-max-ziplist-size -2
list-compress-depth 0

# Security: Set settings
set-max-intset-entries 512

# Security: Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Security: Stream settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Security: Active rehashing
activerehashing yes

# Security: Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Security: Client query buffer limit
client-query-buffer-limit 1gb

# Security: Protocol buffer limit  
proto-max-bulk-len 512mb

# Security: Replication settings
repl-timeout 60
repl-ping-replica-period 10
repl-backlog-size 1mb
repl-backlog-ttl 3600

# Security: Master authentication
# masterauth will be set in start script if needed

# Security: Keyspace notifications (disabled for security)
notify-keyspace-events ""

# Security: Latency monitoring
latency-monitor-threshold 100

# Security: Memory usage tracking
tracking-table-max-keys 1000000