# Security-hardened FastAPI server configuration

server {
    listen 8001 default_server;
    listen [::]:8001 default_server;
    server_name _;
    
    # Security: Root directory
    root /usr/share/nginx/html;
    index index.html;
    
    # Security: Connection limits
    limit_conn conn_limit_per_ip 20;
    
    # Security: General rate limiting
    limit_req zone=api burst=50 nodelay;
    
    # Security: Request size limits
    client_max_body_size 5M;
    
    # Security: Disable server signature
    server_tokens off;
    
    # Security: Logging
    access_log /var/log/nginx/fastapi_access.log security_log;
    error_log /var/log/nginx/fastapi_error.log;
    
    # Security: Block common attack patterns
    location ~* \.(sql|bak|backup|tar|gz|tgz|zip|rar)$ {
        deny all;
        return 403;
    }
    
    # Security: Block hidden files
    location ~ /\. {
        deny all;
        return 403;
    }
    
    # Security: Block common exploit attempts
    location ~* (eval\(|base64_decode|gzinflate|rot13|str_rot13) {
        deny all;
        return 403;
    }
    
    # Security: Block SQL injection patterns
    location ~* (union.*select|select.*union|insert.*into|delete.*from|drop.*table) {
        deny all;
        return 403;
    }
    
    # Security: Rate limiting for authentication endpoints
    location ~ ^/api/(auth|token) {
        limit_req zone=auth burst=2 nodelay;
        
        # Security: Additional headers for auth endpoints
        add_header X-Auth-Endpoint "true" always;
        
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # Security: Rate limiting for file upload endpoints
    location ~ ^/api/resumes/upload {
        limit_req zone=upload burst=3 nodelay;
        
        # Security: File upload specific settings
        client_max_body_size 5M;
        client_body_timeout 30;
        
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # Security: Health check endpoint (less restrictive)
    location ~ ^/api/observability/health {
        limit_req zone=api burst=100 nodelay;
        
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # Security: API documentation endpoints
    location ~ ^/(docs|redoc|openapi\.json) {
        limit_req zone=api burst=20 nodelay;
        
        # Security: Additional CSP for docs
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self';" always;
        
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # General API endpoint protection
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        
        # Security: Block requests with no user agent
        if ($http_user_agent = "") {
            return 403;
        }
        
        # Security: Block requests with suspicious user agents
        if ($http_user_agent ~* (wget|curl|libwww|python|nikto|scan|nmap)) {
            return 403;
        }
        
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # Root endpoint
    location = / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://fastapi_backend;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    
    # Security: Default deny for unmatched locations
    location / {
        deny all;
        return 403;
    }
    
    # Security: Custom error pages (prevent information disclosure)
    error_page 400 401 402 403 404 /error.html;
    error_page 500 502 503 504 /error.html;
    
    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }
}