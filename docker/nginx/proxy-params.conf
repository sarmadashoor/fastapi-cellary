# Security-hardened proxy parameters for nginx

# Security: Forward client information securely
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Security: Remove server identification headers
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# Security: Connection settings
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Security: Buffer settings to prevent overflow
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;
proxy_temp_file_write_size 8k;

# Security: Disable proxy caching for sensitive data
proxy_no_cache $cookie_sessionid $http_authorization;
proxy_cache_bypass $cookie_sessionid $http_authorization;

# Security: Protocol version
proxy_http_version 1.1;

# Security: Connection reuse
proxy_set_header Connection "";

# Security: Request ID for tracing
proxy_set_header X-Request-ID $request_id;

# Security: Client information for rate limiting
proxy_set_header X-Client-IP $remote_addr;
proxy_set_header X-Client-Country $geoip_country_code;