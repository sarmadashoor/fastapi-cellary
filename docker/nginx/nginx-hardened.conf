# Security-hardened nginx configuration
# Based on nginx security best practices

# Security: Run as non-root user
user nginx-app;

# Performance: Set worker processes
worker_processes auto;

# Security: Set error log location
error_log /var/log/nginx/error.log warn;

# Security: Set PID file location
pid /var/run/nginx/nginx.pid;

# Security: Worker process settings
worker_rlimit_nofile 8192;

events {
    # Performance: Connection handling
    worker_connections 1024;
    use epoll;
    multi_accept on;
    
    # Security: Disable accept_mutex for security
    accept_mutex off;
}

http {
    # Security: Hide nginx version
    server_tokens off;
    
    # Security: MIME type handling
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Security: Charset
    charset utf-8;
    
    # Performance: Sendfile optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Security: Timeouts
    keepalive_timeout 15;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Security: Buffer sizes to prevent buffer overflow attacks
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 5M;  # Match our file upload limit
    large_client_header_buffers 4 8k;
    
    # Security: Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    
    # Security: Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Security: Logging format with security information
    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time '
                           'ua="$upstream_addr" us="$upstream_status" '
                           'ut="$upstream_response_time" ul="$upstream_response_length" '
                           'cs=$upstream_cache_status '
                           'country="$geoip_country_code" '
                           'xff="$http_x_forwarded_for"';
    
    # Security: Access log
    access_log /var/log/nginx/access.log security_log;
    
    # Security: Gzip settings (carefully configured to avoid BREACH attacks)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/plain
        text/css
        text/xml
        text/javascript;
    
    # Security: Disable gzip for sensitive content
    gzip_disable "msie6";
    
    # Security: SSL/TLS settings (for HTTPS in production)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security: Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Security: Content Security Policy (restrictive for API)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; media-src 'none'; frame-src 'none';" always;
    
    # Security: HSTS (for HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Security: Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=(), fullscreen=()" always;
    
    # Security: Server identification
    more_set_headers "Server: FastAPI-Celery-Hardened";
    
    # Performance: Upstream backend servers
    upstream fastapi_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        
        # Health checks
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Include additional configuration files
    include /etc/nginx/conf.d/*.conf;
}

# Security: Stream module for additional protections
stream {
    # Security: Connection limiting at stream level
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
    
    # Security: Rate limiting for stream connections
    limit_conn stream_conn 10;
}